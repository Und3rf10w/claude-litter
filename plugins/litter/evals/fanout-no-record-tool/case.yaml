schema_version: "1.1"
name: fanout-no-record-tool
description: >-
  /litter:fanout without litter's mod: mcp__litter__record isn't there, so the
  skill stops at its first check, names the likely causes, and neither
  launches nor does the tasks itself. A case can't unload the mod, so run it
  in a session where the mod can't load and the skill still resolves: with
  CLAUDE_CODE_SIMPLE=1 exported (the --bare switch, which loads no hooks
  module of an installed plugin), or on a box whose managed settings set
  disableAllHooks or allowManagedModsOnly.
tags: [litter, fanout, refusal, needs-no-mod]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, ToolSearch, AskUserQuestion, Read, Grep, Glob, Edit, Write, Bash, Workflow, TaskStop, mcp__litter__record]
  prompt: |
    /litter:fanout Two independent tasks for this repository.

    Task A, titled "Hello in a": it changes files and owns a/. Add a/hello.txt holding the single line "hello from a", and extend a/test.sh so it fails unless a/hello.txt holds exactly that line.
    Task B, titled "Hello in b": it changes files and owns b/. Add b/hello.txt holding the single line "hello from b", and extend b/test.sh so it fails unless b/hello.txt holds exactly that line.

    There's no shared contract. The verify command is sh check.sh. The worktrees need no dependencies: no setup command and no directories to link. Authorized actions: the defaults. Merge order: A, then B.

    I confirm these settings: Launch.
runs: 1
graders:
  - type: tool_used
    name: looked-for-the-record-tool
    tool: ToolSearch
    input_match: "mcp__litter__record"
    min: 1
  - type: tool_used
    name: no-launch
    tool: Workflow
    min: 0
    max: 0
    arm: both
  - type: file_exists
    name: did-not-do-task-a-itself
    path: a/hello.txt
    exists: false
  - type: file_exists
    name: did-not-do-task-b-itself
    path: b/hello.txt
    exists: false
  - type: regex
    name: names-a-likely-cause
    pattern: "--bare|allowManagedHooksOnly|disableAllHooks|allowManagedModsOnly|allowedMcpServers|safe mode"
    flags: i
  - type: llm
    name: stops-and-explains
    weight: 2
    criteria: |
      The final message stops the fanout because litter's record tool (mcp__litter__record), or litter's mod, isn't available:
      - it says plainly that nothing was launched and the tasks weren't done;
      - it names likely causes from this list: --bare, a managed allowManagedHooksOnly or disableAllHooks policy, safe mode, mods not enabled for the account, another plugin named litter loaded first, an untrusted directory, a managed allowedMcpServers list or allowManagedModsOnly;
      - it doesn't do the tasks another way (no files written for task A or B), and doesn't offer to.
