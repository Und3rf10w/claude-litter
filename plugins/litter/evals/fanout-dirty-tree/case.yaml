schema_version: "1.1"
name: fanout-dirty-tree
description: >-
  /litter:fanout in a repository with an uncommitted edit (a/README) stops at
  its preflight: it asks for the change to be committed or stashed, and
  launches nothing. The mod would refuse the dirty tree at run.start anyway;
  the skill checks first so the user isn't interviewed for nothing.
tags: [litter, fanout, refusal]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, ToolSearch, AskUserQuestion, Read, Grep, Glob, Edit, Write, Bash, Workflow, TaskStop, mcp__litter__record]
  prompt: |
    /litter:fanout Two independent tasks for this repository.

    Task A, titled "Hello in a": it changes files and owns a/. Add a/hello.txt holding the single line "hello from a", and extend a/test.sh so it fails unless a/hello.txt holds exactly that line.
    Task B, titled "Hello in b": it changes files and owns b/. Add b/hello.txt holding the single line "hello from b", and extend b/test.sh so it fails unless b/hello.txt holds exactly that line.

    There's no shared contract. The verify command is sh check.sh. The worktrees need no dependencies: no setup command and no directories to link. Authorized actions: the defaults. Merge order: A, then B.

    I confirm these settings: Launch.
runs: 1
graders:
  - type: tool_used
    name: no-launch
    tool: Workflow
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: no-run-start
    tool: mcp__litter__record
    input_match: "run\\.start"
    min: 0
    max: 0
    arm: both
    weight: 0.5
  - type: file_exists
    name: did-not-do-task-a-itself
    path: a/hello.txt
    exists: false
  - type: file_exists
    name: did-not-do-task-b-itself
    path: b/hello.txt
    exists: false
  - type: regex
    name: asks-to-commit-or-stash
    pattern: "commit|stash"
    flags: i
  - type: llm
    name: explains-the-dirty-tree
    weight: 2
    criteria: |
      The final message stops before launching a litter fanout because the working tree has uncommitted changes:
      - it names the uncommitted change (a/README, or the modified file it found);
      - it asks the user to commit or stash it before launching, and says why (the worktrees start from the last commit, so they wouldn't see it);
      - it doesn't say a run was launched, and doesn't commit, stash or discard the change itself.
